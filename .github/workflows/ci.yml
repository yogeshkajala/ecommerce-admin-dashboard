# ─────────────────────────────────────────────────────────────────────────────
#  CI Workflow — Build, Test, Push to ghcr.io
#
#  Triggers:
#    - Push to any branch (build + test only)
#    - Pull Request to main (build + test only)
#    - Push to main or release/* (build + test + push Docker image)
#
#  Image naming:
#    ghcr.io/yogeshverma/ecommerce-admin:<git-sha>
#    ghcr.io/yogeshverma/ecommerce-admin:latest   (main only)
#    ghcr.io/yogeshverma/ecommerce-admin:<tag>    (release/* branches)
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Build, Test & Push

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write   # Required to push to ghcr.io using GITHUB_TOKEN

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Job 1: Build & Test
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    # Testcontainers (PostgreSQL + RabbitMQ) need Docker — ubuntu-latest has it.
    # These service definitions are NOT used by Testcontainers directly;
    # Testcontainers manages its own containers. Listed here for documentation.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore EcommerceAdmin.sln

      - name: Build (Release)
        run: dotnet build EcommerceAdmin.sln --configuration Release --no-restore

      - name: Run Tests
        run: |
          dotnet test tests/EcommerceAdmin.Tests/EcommerceAdmin.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --verbosity normal
        env:
          # Testcontainers uses Docker socket — ensure it can connect
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  # ─────────────────────────────────────────────────────────────────────────
  #  Job 2: Build & Push Docker Image (only on main or release/*)
  # ─────────────────────────────────────────────────────────────────────────
  push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      sha_short:  ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is auto-injected — no extra PAT needed for personal repos

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecommerce-admin
          tags: |
            # Full commit SHA — used by CD workflows for exact version pinning
            type=sha,format=long,prefix=
            # Short SHA for readability
            type=sha,format=short,prefix=sha-
            # 'latest' tag only on main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Semver tag for release/* branches (e.g. release/1.2.3 → v1.2.3)
            type=match,pattern=release/(.*),group=1,prefix=v
          labels: |
            org.opencontainers.image.title=EcommerceAdmin API
            org.opencontainers.image.description=EcommerceAdmin .NET 8 Web API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching using GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image summary
        run: |
          echo "## 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`ghcr.io/${{ github.repository_owner }}/ecommerce-admin\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
